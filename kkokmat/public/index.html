<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f2"><meta name="description" content="잘 맞는 옷으로 찾는 다음 사이즈. 국내 영유아복의 공식 실측과 키·체중 가이드를 비교해 보세요.">
  <title>KKOKMAT 꼭맞 · 아기 옷 사이즈 비교</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./mobile-design.css"><link rel="stylesheet" href="./account.css"><link rel="stylesheet" href="./desktop-layout.css" media="(min-width:721px)"><link rel="stylesheet" href="./review-refinements.css"><link rel="stylesheet" href="./figma-home.css"><link rel="stylesheet" href="./chart-capture.css">
</head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="kk-wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="kk-crayon" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="1" seed="4" result="e"/><feDisplacementMap in="SourceGraphic" in2="e" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="s"/><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="9" result="g"/><feColorMatrix in="g" type="matrix" values="0 0 0 0 .26  0 0 0 0 .17  0 0 0 0 .12  0 0 0 -1.5 .66" result="gm"/><feComposite in="gm" in2="s" operator="in" result="gi"/><feMerge><feMergeNode in="s"/><feMergeNode in="gi"/></feMerge></filter></defs></svg><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./responsive-app.js"></script>
