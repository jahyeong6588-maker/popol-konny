<text x="64" y="628" font-size="13" fill="#7a6e64">별·형광펜 밑줄·체크·반짝이·입자 질감 제거 / 강조는 "기준" 한 단어의 색으로만</text><text x="64" y="648" font-size="13" fill="#7a6e64">그림은 같은 80 라벨의 옷 두 벌을 겹쳐 "같은 숫자여도 크기는 다르다"를 보여줌</text>
