<text x="96" y="196" font-size="14" font-weight="800" letter-spacing="1.6" fill="#675950">작은 옷, 더 쉬운 선택</text>
<text x="94" y="276" font-size="60" font-weight="800" letter-spacing="-2.4" fill="#4c4038">잘 맞던 그 옷이,</text>
<text x="94" y="356" font-size="60" font-weight="800" letter-spacing="-2.4" fill="#4c4038">새 옷의 <tspan fill="#675950">기준</tspan>이 되도록.</text>
<text x="96" y="412" font-size="17" fill="#7a6e64">브랜드가 달라도 괜찮아요.</text>
<text x="96" y="440" font-size="17" fill="#7a6e64">입던 옷과 나란히 비교하고, 다음 사이즈를 찾아보세요.</text>
